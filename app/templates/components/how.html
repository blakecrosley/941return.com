<section id="everywhere" class="rcs-everywhere" :class="'hero-theme-' + (typeof currentTheme !== 'undefined' ? currentTheme : 'water')">
    <div class="container">
        <p class="how-kicker" data-how-reveal>One app, every screen</p>
        <h2 class="how-title" data-how-reveal style="--d:.08s">Return is wherever you are</h2>
        <p class="rcs-everywhere__sub" data-how-reveal style="--d:.16s">
            The same calm timer — living scenes, ambient sound, your sessions in sync —
            on iPhone, Apple Watch, Mac, Apple TV, and iPad.
        </p>

        <div class="rcs-devices" data-how-reveal style="--d:.24s">
            <div class="rcs-devices__row">
                <div class="rcs-device rcs-device--tv">
                    <div class="rcs-mockup"><img src="/static/images/devices/appletv-fire-en.webp" width="1400" height="905" alt="Return on Apple TV with the Fire scene" loading="lazy"></div>
                    <span class="rcs-device__label">Apple TV</span>
                </div>
                <div class="rcs-device rcs-device--mac">
                    <div class="rcs-mockup"><img src="/static/images/devices/mac-fire-en.webp" width="1400" height="921" alt="Return on Mac with the Fire scene" loading="lazy"></div>
                    <span class="rcs-device__label">Mac</span>
                </div>
            </div>
            <div class="rcs-devices__row">
                <div class="rcs-device rcs-device--ipad">
                    <div class="rcs-mockup"><img src="/static/images/devices/ipad-fire-en.webp" width="1200" height="1565" alt="Return on iPad with the Fire scene" loading="lazy"></div>
                    <span class="rcs-device__label">iPad</span>
                </div>
                <div class="rcs-device rcs-device--iphone">
                    <div class="rcs-mockup"><img src="/static/images/devices/iphone-fire-en.webp" width="1200" height="2486" alt="Return on iPhone with the Fire scene" loading="lazy"></div>
                    <span class="rcs-device__label">iPhone</span>
                </div>
                <div class="rcs-device rcs-device--watch">
                    <div class="rcs-mockup"><img src="/static/images/devices/watch-fire-en.webp" width="600" height="960" alt="Return on Apple Watch with the Fire scene" loading="lazy"></div>
                    <span class="rcs-device__label">Apple Watch</span>
                </div>
            </div>
        </div>
    </div>
</section>

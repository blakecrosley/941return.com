<section class="hero rcs-scope" :class="'hero-theme-' + currentTheme" x-data="returnCaseStudy()">
    <div class="hero-ambient" aria-hidden="true"></div>
    <div class="container hero-container">
        <div class="hero-copy">
            <h1 class="hero-title">Return to<br><span class="hero-title-accent" :style="`color: ${themeColor}`">stillness.</span></h1>
            <p class="hero-subtitle">
                A minimal, zen-like meditation timer for iPhone, Apple Watch, Mac, and Apple TV.
                Breathe to a living scene — water, fire, forest, or pure silence.
            </p>
            <div class="hero-cta">
                <a href="https://apps.apple.com/app/return/id6756242021" class="app-store-badge" target="_blank" rel="noopener">
                    <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" width="180" height="60">
                </a>
            </div>
        </div>

        <div class="hero-phone-wrap">
            <!-- Real iPhone frame -->
            <div class="rcs-iphone">
                <div class="rcs-phone" :class="{ 'rcs-phone--playing': isPlaying }">
                    <div class="rcs-phone__stage">
                        <video class="rcs-hero__video" :class="{ 'rcs-hero__video--active': currentTheme === 'water' }"
                               poster="/static/images/posters/water-mobile-poster.jpg" loop playsinline disablepictureinpicture
                               preload="auto" controlslist="nodownload nofullscreen noremoteplayback" x-ref="videoWater">
                            <source src="/static/videos/water-mobile.webm" type="video/webm">
                            <source src="/static/videos/water-mobile.mp4" type="video/mp4">
                        </video>
                        <video class="rcs-hero__video" :class="{ 'rcs-hero__video--active': currentTheme === 'fire' }"
                               poster="/static/images/posters/fire-mobile-poster.jpg" loop playsinline disablepictureinpicture
                               preload="metadata" controlslist="nodownload nofullscreen noremoteplayback" x-ref="videoFire">
                            <source src="/static/videos/fire-mobile.webm" type="video/webm">
                            <source src="/static/videos/fire-mobile.mp4" type="video/mp4">
                        </video>
                        <video class="rcs-hero__video" :class="{ 'rcs-hero__video--active': currentTheme === 'forest' }"
                               poster="/static/images/posters/forest-mobile-poster.jpg" loop playsinline disablepictureinpicture
                               preload="metadata" controlslist="nodownload nofullscreen noremoteplayback" x-ref="videoForest">
                            <source src="/static/videos/forest-mobile.webm" type="video/webm">
                            <source src="/static/videos/forest-mobile.mp4" type="video/mp4">
                        </video>
                        <div class="rcs-hero__overlay"></div>
                    </div>

                    <div class="rcs-phone__ui">
                        <button class="rcs-phone__play" @click="togglePlayOnly()" :aria-label="isPlaying ? 'Pause' : 'Play'">
                            <svg x-show="!isPlaying" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
                            <svg x-show="isPlaying" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
                        </button>
                        <div class="rcs-phone__dots" role="group" aria-label="Choose a scene">
                            <button class="rcs-phone__dot rcs-phone__dot--water" @click="selectTheme('water')" :aria-pressed="currentTheme === 'water'" aria-label="Water"></button>
                            <button class="rcs-phone__dot rcs-phone__dot--fire" @click="selectTheme('fire')" :aria-pressed="currentTheme === 'fire'" aria-label="Fire"></button>
                            <button class="rcs-phone__dot rcs-phone__dot--forest" @click="selectTheme('forest')" :aria-pressed="currentTheme === 'forest'" aria-label="Forest"></button>
                        </div>
                    </div>
                </div>
                <img class="rcs-iphone__frame" src="/static/images/iphone-frame.png" alt="" aria-hidden="true">
            </div>
        </div>
    </div>
</section>

<script>
function returnCaseStudy() {
  return {
    currentTheme: 'water',
    themes: ['water', 'fire', 'forest'],
    themeColors: { water: '#59B2CC', fire: '#FF8033', forest: '#66C059' },
    get themeColor() { return this.themeColors[this.currentTheme] || '#59B2CC'; },
    isPlaying: false,
    audioContext: null,
    audioEnabled: false,
    audioBuffers: {},
    currentSource: null,
    currentVideo() {
      const ref = 'video' + this.currentTheme.charAt(0).toUpperCase() + this.currentTheme.slice(1);
      return this.$refs[ref] || null;
    },
    async selectTheme(theme) {
      if (theme === this.currentTheme) return;
      const wasPlaying = this.isPlaying;
      const prev = this.currentVideo();
      if (prev && !prev.paused) prev.pause();
      this.currentTheme = theme;
      if (wasPlaying) {
        const next = this.currentVideo();
        if (next) { try { next.currentTime = 0; } catch (e) {} next.play().catch(() => {}); }
        if (this.audioContext && this.audioEnabled) { await this.playAmbient(theme); }
      }
    },
    togglePlayOnly() {
      const v = this.currentVideo();
      if (!v) return;
      if (v.paused) {
        // Start the video and flip the UI immediately — never wait on the
        // audio fetch/decode first (that caused the delay + double-press).
        this.isPlaying = true;
        const p = v.play();
        if (p && p.catch) p.catch(() => {});
        // Ambient audio loads in the background; it's best-effort.
        (async () => {
          try {
            if (!this.audioContext) { this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
            if (this.audioContext.state === 'suspended') { await this.audioContext.resume(); }
            this.audioEnabled = true;
            await this.playAmbient(this.currentTheme);
          } catch (e) { /* audio is optional; the scene still plays */ }
        })();
      } else {
        v.pause();
        this.stopAmbient();
        this.isPlaying = false;
      }
    },
    async playAmbient(theme) {
      if (!this.audioContext || !this.audioEnabled) return;
      this.stopAmbient();
      if (!this.audioBuffers[theme]) {
        try {
          const res = await fetch('/static/audio/' + theme + '.mp3');
          const arr = await res.arrayBuffer();
          this.audioBuffers[theme] = await this.audioContext.decodeAudioData(arr);
        } catch (e) { console.warn('audio load failed', e); return; }
      }
      const source = this.audioContext.createBufferSource();
      source.buffer = this.audioBuffers[theme];
      source.loop = true;
      source.connect(this.audioContext.destination);
      source.start(0);
      this.currentSource = source;
    },
    stopAmbient() {
      if (this.currentSource) { try { this.currentSource.stop(); } catch (e) {} this.currentSource = null; }
    },
  };
}
</script>
